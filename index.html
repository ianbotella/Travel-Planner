<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora del viaje — 25 oct / 14 nov</title>
<meta name="description" content="Itinerario del viaje: España, Reino Unido, Ámsterdam/Suiza, Italia.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="masthead">
  <div class="masthead__inner">
    <p class="masthead__eyebrow">Bitácora de viaje</p>
    <h1 class="masthead__title" id="viaje-titulo">Cargando itinerario…</h1>
    <p class="masthead__sub" id="viaje-subtitulo"></p>
    <p class="masthead__crew" id="viaje-crew"></p>
  </div>
</header>

<nav class="blocknav" id="blocknav" aria-label="Tramos del viaje">
  <!-- se completa por JS -->
</nav>

<section class="pending" id="pending-panel" hidden>
  <h2 class="pending__title">Pendientes por resolver</h2>
  <ul class="pending__list" id="pending-list">
    <!-- se completa por JS -->
  </ul>
</section>

<section class="checklist" id="transporte-panel" aria-labelledby="transporte-heading">
  <div class="checklist__head">
    <h2 class="checklist__title" id="transporte-heading">Pasajes</h2>
    <p class="checklist__progress" id="transporte-progress"></p>
  </div>
  <div class="checklist__grid checklist__grid--tickets" id="transporte-grid">
    <!-- se completa por JS -->
  </div>
</section>

<section class="checklist" id="hospedajes-panel" aria-labelledby="hospedajes-heading">
  <div class="checklist__head">
    <h2 class="checklist__title" id="hospedajes-heading">Hospedajes</h2>
    <p class="checklist__progress" id="hospedajes-progress"></p>
  </div>
  <div class="checklist__grid checklist__grid--tags" id="hospedajes-grid">
    <!-- se completa por JS -->
  </div>
</section>

<main class="timeline" id="timeline">
  <!-- se completa por JS: secciones por bloque, cada una con tarjetas de día -->
</main>

<footer class="sitefoot">
  <p>Editá <code>data/itinerario.json</code> para actualizar el itinerario. Los comentarios se guardan como GitHub Discussions del repo.</p>
</footer>

<script src="js/app.js"></script>
</body>
</html>
